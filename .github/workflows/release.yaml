# Release on every push to main, driven by semantic-release:
#   conventional commits -> next version -> CHANGELOG.md + package.json commit
#   -> vX.Y.Z tag -> GitHub Release -> `npm stage publish`.
#
# THE LAST STEP DOES NOT PUBLISH. `npm stage publish` uploads the tarball to
# npm in a pending state nobody can install. A green run means the version is
# QUEUED; a maintainer promotes it, which costs a 2FA challenge:
#
#   npm stage list @eco-foundation/chains
#   npm stage approve <stage-id>          # or: npm stage reject <stage-id>
#
# The split is deliberate: npm removes direct publish from granular access
# tokens in January 2027, and no CI credential -- token or OIDC -- can satisfy
# an approval. A stolen runner token can queue a release; it can never ship
# one. Same promotion model as eco/eco-api-schemas, with semantic-release kept
# for versioning, changelog, tag and GitHub Release.
#
# Secrets: GH_TOKEN (GitHub App token; pushes the release commit + tag and
# creates the Release) and NPM_TOKEN (granular token scoped to
# @eco-foundation/chains with "Read and write (stage only)", no 2FA bypass).
name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.GH_TOKEN }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      # `npm stage` landed in npm 11.15.0; the npm bundled with the .nvmrc Node
      # predates it. Upgrading npm in this job alone leaves every other job on
      # the pinned Node's bundled npm.
      - name: Upgrade npm for `npm stage`
        run: npm install -g npm@^11.15.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm format:check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Configure Git User
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"

      - name: Release (version, changelog, tag, GitHub Release, npm stage)
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npx semantic-release
